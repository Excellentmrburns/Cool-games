<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Hub | Unblocked</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f0f12;
            color: #f5f5f7;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 3rem 1rem;
            background: linear-gradient(180deg, #16161a 0%, #0f0f12 100%);
            border-bottom: 1px solid #232329;
        }

        header h1 {
            font-size: 2.8rem;
            color: #00ff66;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header p {
            color: #8a8a93;
            font-size: 1.1rem;
        }

        .search-container {
            margin-top: 1.5rem;
            display: flex;
            justify-content: center;
        }

        .search-container input {
            width: 100%;
            max-width: 400px;
            padding: 0.8rem 1.2rem;
            font-size: 1rem;
            background-color: #16161a;
            border: 2px solid #232329;
            border-radius: 25px;
            color: #ffffff;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-container input:focus {
            border-color: #00ff66;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            padding: 1rem 2rem;
        }

        .section-title {
            font-size: 1.6rem;
            color: #ffffff;
            margin: 2.5rem 0 1.2rem 0;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            margin-bottom: 1.5rem;
        }

        .game-card {
            background-color: #16161a;
            border: 1px solid #232329;
            border-radius: 12px;
            padding: 1.2rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #00ff66;
            box-shadow: 0 10px 20px rgba(0, 255, 102, 0.1);
        }

        .game-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 1rem;
            background-color: #232329;
        }

        .game-card h3 {
            font-size: 1.2rem;
            margin-bottom: 1.2rem;
            font-weight: 500;
        }

        .play-btn {
            display: block;
            background-color: #00ff66;
            color: #000000;
            text-decoration: none;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.2s ease;
        }

        .play-btn:hover {
            background-color: #00cc52;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background-color: #16161a;
            margin-top: auto;
            border-top: 1px solid #232329;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎮 Arcade Hub</h1>
        <p>Your ultimate portal for open-source browser games.</p>
        <div class="search-container">
            <input type="text" id="gameSearch" placeholder="Search for a game..." onkeyup="filterGames()">
        </div>
    </header>

    <main class="container">
        
        <!-- Live Retro Section -->
        <h2 class="section-title">🕹️ Arcade & Classics</h2>
        <div class="games-grid">
            <div class="game-card">
                <img src="https://unsplash.com" alt="Slope">
                <h3>Slope</h3>
                <a href="https://github.io" target="_blank" class="play-btn">Play Now</a>
            </div>
            <div class="game-card">
                <img src="https://unsplash.com" alt="Space Invaders">
                <h3>Space Invaders</h3>
                <a href="https://github.io" target="_blank" class="play-btn">Play Now</a>
            </div>
            <div class="game-card">
                <img src="https://unsplash.com" alt="Hextris">
                <h3>Hextris</h3>
                <a href="https://github.io" target="_blank" class="play-btn">Play Now</a>
            </div>
            <div class="game-card">
                <img src="https://unsplash.com" alt="2048">
                <h3>2048</h3>
                <a href="https://github.io" target="_blank" class="play-btn">Play Now</a>
            </div>
        </div>

        <!-- Driving and Casual Section -->
        <h2 class="section-title">🏎️ Casual & Speed</h2>
        <div class="games-grid">
            <div class="game-card">
                <img src="https://unsplash.com" alt="Drift Hunters">
                <h3>Drift Hunters</h3>
                <a href="https://github.io" target="_blank" class="play-btn">Play Now</a>
            </div>
            <div class="game-card">
                <img src="https://unsplash.com" alt="Flappy Bird">
                <h3>Flappy Bird</h3>
                <a href="https://github.io" target="_blank" class="play-btn">Play Now</a>
            </div>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 Arcade Hub. Built with open-source technology.</p>
    </footer>

    <script>
        function filterGames() {
            let input = document.getElementById('gameSearch').value.toLowerCase();
            let cards = document.getElementsByClassName('game-card');
            
            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getElementsByTagName('h3')[0].innerText.toLowerCase();
                if (title.includes(input)) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>

</body>
</html>
